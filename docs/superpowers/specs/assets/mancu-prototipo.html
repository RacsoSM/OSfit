<title>Mancu, mascota de OSfit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Patrick+Hand&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: tres propuestas del disco de 20 kg en filas; cada fila trae nombre, nota y tres poses sobre papel con sol. Un solo look a propósito. */
:root{
  --papel:#f3e7c9; --papel2:#eadbb3; --sol:#f7d774; --rojo:#d9412b; --tinta:#1b1512; --marron:#5a4a40;
  --display:'Lilita One','Arial Black',sans-serif; --cuerpo:'Nunito',system-ui,sans-serif; --mano:'Patrick Hand','Comic Sans MS',cursive;
  color-scheme:light;
}
body{background:var(--papel);color:var(--tinta);font-family:var(--cuerpo);font-weight:600;line-height:1.5;padding-inline:16px;padding-block:28px}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,6vw,3.6rem);line-height:1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:0;line-height:1.1}
p{margin:0;max-width:62ch}
.eti{font-family:var(--mano);font-size:1.1rem;color:var(--marron);letter-spacing:.04em;text-transform:uppercase}
.est{display:flex;flex-direction:column;gap:12px;min-width:0}
.est header{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.letra{font-family:var(--display);background:var(--tinta);color:var(--papel);width:2.2rem;height:2.2rem;border-radius:50%;display:inline-grid;place-items:center;font-size:1.3rem;flex:none}
.est .nota{color:var(--marron)}
.fila{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.pose{position:relative;background:var(--papel2);border:3px solid var(--tinta);border-radius:18px 24px 16px 22px;padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;overflow:hidden}
.pose::before{content:"";position:absolute;width:72%;aspect-ratio:1;border-radius:50%;background:var(--sol);opacity:.75;top:6%;left:14%}
.pose svg{position:relative;width:100%;max-width:210px;height:auto}
.pose b{position:relative;font-family:var(--mano);font-weight:400;font-size:1.2rem}
.tel{aspect-ratio:9/16;max-height:520px;border:4px solid var(--tinta);border-radius:22px;background:var(--papel);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:22px 12px 16px;box-shadow:5px 5px 0 var(--tinta);min-width:0}
.tel>*{position:relative}
.tel .sol{position:absolute;width:90%;aspect-ratio:1;border-radius:50%;background:var(--sol);left:5%;top:28%;opacity:.85}
.tel .num{align-self:flex-start;font-family:var(--mano);font-size:1.05rem;color:var(--rojo)}
.tel .tit{font-family:var(--display);font-size:2.1rem;line-height:1;text-align:center}
.tel .tit em{font-style:normal;color:var(--rojo)}
.tel .big{font-family:var(--display);font-size:4.6rem;line-height:.9;color:var(--rojo);-webkit-text-stroke:2px var(--tinta);text-shadow:3px 3px 0 var(--tinta)}
.tel .big small{font-size:1.6rem;-webkit-text-stroke:0;text-shadow:none;color:var(--tinta)}
.tel svg{width:80%;height:auto}
.tel .pie{font-family:var(--mano);font-size:1.05rem;text-align:center;line-height:1.2}
@keyframes parp{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.parp{animation:parp 3.6s infinite;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){.parp{animation:none}}
</style>

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:10px">
    <div class="eti">Diseño elegido · disco de 20 kg</div>
    <h1>Mancu, el disco gris de 20 kg</h1>
    <p>Disco olímpico visto de frente, con ojos, piernas y brazos de manguera. Sin nariz ni agujero central.</p>
  </header>
  <div id="estilos" class="wrap" style="gap:36px"></div>
</div>

<script>
const INK='#1b1512',RED='#d9412b',SOL='#f7d774';
const G1='#8f9298',G2='#6d7076',G3='#4a4d52',G4='#c9ccd1';

function cara(cx,cy,sp,s,p){
  const ojo=x=>{
    if(p.ojos==='feliz') return `<path d="M${x-10*s} ${cy+4*s} Q${x} ${cy-11*s} ${x+10*s} ${cy+4*s}" fill="none" stroke="${INK}" stroke-width="${4.5*s}" stroke-linecap="round"/>`;
    if(p.ojos==='fuerza') return `<ellipse cx="${x}" cy="${cy}" rx="${10*s}" ry="${8*s}" fill="#fff" stroke="${INK}" stroke-width="${3.5*s}"/><circle cx="${x}" cy="${cy+s}" r="${4.5*s}" fill="${INK}"/>`;
    return `<g class="parp"><ellipse cx="${x}" cy="${cy}" rx="${11*s}" ry="${13*s}" fill="#fff" stroke="${INK}" stroke-width="${3.5*s}"/><circle cx="${x+s}" cy="${cy+2*s}" r="${6*s}" fill="${INK}"/><circle cx="${x+3*s}" cy="${cy-2*s}" r="${2*s}" fill="#fff"/></g>`;
  };
  const cejas=p.ojos==='fuerza'?`<path d="M${cx-sp-12*s} ${cy-15*s} L${cx-sp+10*s} ${cy-8*s} M${cx+sp+12*s} ${cy-15*s} L${cx+sp-10*s} ${cy-8*s}" stroke="${INK}" stroke-width="${4.5*s}" stroke-linecap="round"/>`:'';
  const mej=`<circle cx="${cx-sp-9*s}" cy="${cy+16*s}" r="${6*s}" fill="${RED}" opacity=".75"/><circle cx="${cx+sp+9*s}" cy="${cy+16*s}" r="${6*s}" fill="${RED}" opacity=".75"/>`;
  return mej+cejas+ojo(cx-sp)+ojo(cx+sp);
}
const boca=(cx,cy,p)=>({
  sonrisa:`<path d="M${cx-13} ${cy} Q${cx} ${cy+13} ${cx+13} ${cy}" fill="none" stroke="${INK}" stroke-width="4.5" stroke-linecap="round"/>`,
  abierta:`<path d="M${cx-15} ${cy-2} Q${cx} ${cy+26} ${cx+15} ${cy-2}Z" fill="#8c2a1c" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/><ellipse cx="${cx}" cy="${cy+11}" rx="7" ry="4" fill="#e8796a"/>`,
  dientes:`<rect x="${cx-15}" y="${cy-3}" width="30" height="14" rx="5" fill="#fff" stroke="${INK}" stroke-width="4"/><path d="M${cx-5} ${cy-3}v14M${cx+5} ${cy-3}v14" stroke="${INK}" stroke-width="2"/>`
}[p.boca||'sonrisa']);

const sudor=`<path d="M166 34 q-6 10 0 14 q6 -4 0 -14z M30 44 q-5 9 0 12 q5 -3 0 -12z" fill="#6ec6e8" stroke="${INK}" stroke-width="3"/>`;
const confeti=`<g stroke="${INK}" stroke-width="2"><rect x="18" y="12" width="10" height="5" fill="${SOL}" transform="rotate(30 23 14)"/><rect x="170" y="8" width="10" height="5" fill="${RED}" transform="rotate(-20 175 10)"/><circle cx="100" cy="6" r="4" fill="${SOL}"/><rect x="184" y="62" width="9" height="5" fill="${SOL}"/><circle cx="10" cy="60" r="4" fill="${RED}"/></g>`;
const zapato=(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="14" ry="7" fill="${RED}" stroke="${INK}" stroke-width="4"/>`;
const guante=(x,y)=>`<circle cx="${x}" cy="${y}" r="8" fill="#fff" stroke="${INK}" stroke-width="4"/>`;
const hose=d=>`<path d="${d}" fill="none" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`;
const sombra=w=>`<ellipse cx="100" cy="192" rx="${w}" ry="5" fill="${INK}" opacity=".18"/>`;
const svg=inner=>`<svg viewBox="0 0 200 200" role="img" aria-label="Mancu">${inner}</svg>`;

function piernas(p){
  if(p.salto) return hose('M84 148 Q74 168 66 184')+hose('M116 148 Q126 168 134 184')+zapato(60,188)+zapato(140,188);
  if(p.ojos==='fuerza') return hose('M80 148 Q66 166 60 182')+hose('M120 148 Q134 166 140 182')+zapato(54,186)+zapato(146,186);
  return hose('M84 148 L82 182')+hose('M116 148 L118 182')+zapato(76,186)+zapato(124,186);
}
function brazos(p){
  return {
    hola:hose('M40 92 Q20 96 14 116')+guante(14,118)+hose('M160 84 Q184 74 188 46')+guante(188,42),
    orgullo:hose('M40 86 Q12 70 10 40')+guante(10,36)+hose('M160 86 Q188 70 190 40')+guante(190,36),
    esfuerzo:hose('M40 94 Q18 110 14 132')+guante(14,134)+hose('M160 94 Q182 110 186 132')+guante(186,134)
  }[p.brazos];
}
/* disco base: aro, relieve, brillo y texto "20 KG" en arco inferior */
function disco(cx,cy,r,uid){
  return `<defs><path id="arc${uid}" d="M${cx-50} ${cy} A50 50 0 0 0 ${cx+50} ${cy}"/></defs>
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="${G1}" stroke="${INK}" stroke-width="5"/>
  <circle cx="${cx}" cy="${cy}" r="${r-7}" fill="none" stroke="${G2}" stroke-width="4"/>
  <circle cx="${cx}" cy="${cy}" r="${r-14}" fill="none" stroke="${G4}" stroke-width="2" opacity=".7"/>
  <path d="M${cx-r+14} ${cy-22} Q${cx-r+22} ${cy-r+16} ${cx-24} ${cy-r+10}" stroke="${G4}" stroke-width="5" fill="none" stroke-linecap="round"/>
  <text font-family="Lilita One,Arial Black,sans-serif" font-size="15" letter-spacing="2.5" fill="${G3}" text-anchor="middle"><textPath href="#arc${uid}" startOffset="50%">20 KG</textPath></text>`;
}

/* A. Clásico: el agujero es la nariz */
function clasico(p){
  const dy=p.salto?-12:0;
  return sombra(p.salto?30:56)+`<g transform="translate(0 ${dy})">${piernas(p)}${brazos(p)}${disco(100,88,62,'a')}
   ${cara(100,70,22,1.05,p)}${boca(100,100,p)}${p.extra||''}</g>`;
}
/* B. Boca: el agujero central es la boca, sin brazos */
function boca2(p){
  const dy=p.salto?-12:0, tilt=p.tilt||0;
  const hueco=`<circle cx="100" cy="98" r="15" fill="#2a2326" stroke="${INK}" stroke-width="4"/>`+
    (p.boca==='abierta'?`<ellipse cx="100" cy="105" rx="9" ry="6" fill="#e8796a"/>`:'')+
    (p.boca==='dientes'?`<rect x="88" y="86" width="24" height="9" rx="3" fill="#fff"/><path d="M96 86v9M104 86v9" stroke="${INK}" stroke-width="2"/>`:'');
  const hola=p.brazos==='hola'?`<g transform="rotate(8 100 150)"></g>`:'';
  return sombra(p.salto?30:56)+`<g transform="translate(0 ${dy})">${piernas(p)}<g transform="rotate(${tilt} 100 150)">${disco(100,88,62,'b')}${hueco}${cara(100,60,22,1,p)}</g>${p.extra||''}
   ${p.brazos==='hola'?`<g font-family="Patrick Hand,cursive" font-size="20" fill="${INK}"><text x="150" y="30" transform="rotate(8 150 30)">¡hola!</text></g>`:''}</g>`;
}
/* C. Sticker: borde blanco grueso y sombra dura */
function sticker(p){
  const dy=p.salto?-10:0;
  const cuerpo=(m)=>{
    const f=m==='out'?'#fff':m==='sh'?INK:G1, s=m==='out'?'#fff':INK, sw=m==='out'?20:5, op=m==='sh'?' opacity=".28"':'';
    const pierna=(d)=>`<path d="${d}" fill="none" stroke="${m==='fill'?INK:m==='out'?'#fff':INK}" stroke-width="${m==='out'?24:10}" stroke-linecap="round"${op}/>`;
    const pl=p.salto?pierna('M84 148 Q74 168 66 182')+pierna('M116 148 Q126 168 134 182'):pierna('M84 148 L82 180')+pierna('M116 148 L118 180');
    const br=(()=>{const a={hola:['M40 92 Q20 96 14 116','M160 84 Q184 74 188 46'],orgullo:['M40 86 Q12 70 10 40','M160 86 Q188 70 190 40'],esfuerzo:['M40 94 Q18 110 14 132','M160 94 Q182 110 186 132']}[p.brazos];return a.map(pierna).join('')})();
    return pl+br+`<circle cx="100" cy="88" r="62" fill="${f}" stroke="${s}" stroke-width="${sw}"${op}/>`;
  };
  return sombra(p.salto?30:56)+`<g transform="translate(0 ${dy}) rotate(${p.salto?-6:-3} 100 100)"><g transform="translate(6 7)">${cuerpo('sh')}</g>${cuerpo('out')}${cuerpo('fill')}
   <circle cx="100" cy="88" r="52" fill="none" stroke="${G2}" stroke-width="4"/>
   <path d="M56 70 Q62 48 84 40" stroke="${G4}" stroke-width="5" fill="none" stroke-linecap="round"/>
   <text x="100" y="140" font-family="Lilita One,Arial Black,sans-serif" font-size="17" letter-spacing="2" fill="${RED}" text-anchor="middle">20 KG</text>
   <circle cx="100" cy="86" r="9" fill="#2a2326" stroke="${INK}" stroke-width="4"/>
   ${cara(100,64,22,1,p)}${boca(100,112,p)}
   ${[[14,118,'hola'],[188,42,'hola']].map(()=>'').join('')}${p.extra||''}</g>`;
}

const POSES=[
 ['Hola',{brazos:'hola',ojos:'normal',boca:'sonrisa'}],
 ['Orgulloso',{brazos:'orgullo',ojos:'feliz',boca:'abierta',salto:true,extra:confeti}],
 ['Esfuerzo',{brazos:'esfuerzo',ojos:'fuerza',boca:'dientes',extra:sudor}]
];
const ESTILOS=[
 ['✓','Mancu clásico, sin nariz','Cara limpia: ojos, mejillas y boca sobre el acero, con "20 KG" grabado abajo. Brazos de manguera con guantes para saludar, señalar números y celebrar.',clasico]
];
document.getElementById('estilos').innerHTML=ESTILOS.map(([l,n,d,fn])=>`
 <section class="est"><header><span class="letra">${l}</span><h2>${n}</h2></header><p class="nota">${d}</p>
 <div class="fila">${POSES.map(([pn,po])=>`<div class="pose">${svg(fn(po))}<b>${pn}</b></div>`).join('')}</div></section>`).join('')+`
 <section class="est"><header><h2>Escena de Saludo con Mancu</h2></header><p class="nota">Mismos datos del video actual, con el nuevo look.</p>
 <div class="fila"><div class="tel"><div class="sol"></div><span class="num">Quincena 16–30 sep</span><div class="tit">¡Hola,<br><em>Ana</em>!</div>${svg(clasico(POSES[0][1]))}<div class="pie">Mira cómo te fue estas dos semanas</div></div>
 <div class="tel"><div class="sol"></div><span class="num">Asistencia</span><div class="tit">Entrenaste</div><div class="big">9<small> de 10</small></div>${svg(clasico(POSES[1][1]))}<div class="pie">días hábiles de la quincena</div></div>
 <div class="tel"><div class="sol"></div><span class="num">Racha más larga</span><div class="tit">¡<em>7 días</em><br>seguidos!</div>${svg(clasico(POSES[2][1]))}<div class="pie">Solo detrás de Marcos</div></div></div></section>`;
</script>
