<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <title>OSfit</title>
    <link rel="stylesheet" href="/src/estilos.css" />
  </head>
  <body>
    <!--
      Fondo pintado. Estático a propósito: no se mueve ni reacciona a nada, solo quita el
      negro plano. Vive fuera de #app para que los repintados de Firestore no lo toquen, y
      aria-hidden porque no dice nada que un lector de pantalla deba leer.
    -->
    <svg class="fondo" aria-hidden="true" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
      <defs>
        <filter id="f-suave" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="9" />
        </filter>
        <radialGradient id="halo-claro">
          <stop offset="0%" stop-color="var(--primario)" stop-opacity="0.10" />
          <stop offset="100%" stop-color="var(--primario)" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="halo-hondo">
          <stop offset="0%" stop-color="var(--primario-oscuro)" stop-opacity="0.14" />
          <stop offset="100%" stop-color="var(--primario-oscuro)" stop-opacity="0" />
        </radialGradient>
      </defs>

      <!-- Manchas muy difusas: son las que dan el aire de "pintado" bajo todo lo demás. -->
      <ellipse cx="330" cy="90" rx="250" ry="200" fill="url(#halo-claro)" />
      <ellipse cx="20" cy="520" rx="260" ry="210" fill="url(#halo-hondo)" />
      <ellipse cx="360" cy="790" rx="200" ry="170" fill="url(#halo-claro)" />

      <!-- Líneas deformes, cruzando de lado a lado y saliéndose del marco. -->
      <g fill="none" stroke="var(--primario)" filter="url(#f-suave)" stroke-linecap="round">
        <path d="M -50 200 C 80 130, 170 300, 300 215 S 420 110, 460 180" stroke-width="2.4" stroke-opacity="0.13" />
        <path d="M -40 300 C 120 250, 140 400, 290 340 S 400 250, 450 300" stroke-width="1.6" stroke-opacity="0.08" />
        <path d="M -30 630 C 110 700, 190 510, 330 590 S 420 690, 470 620" stroke-width="2.2" stroke-opacity="0.10" />
        <path d="M -20 740 C 130 690, 200 810, 340 740 S 430 660, 460 700" stroke-width="1.4" stroke-opacity="0.07" />
      </g>
    </svg>

    <!--
      Esqueleto de carga. Vive en el HTML y no en `main.ts` a propósito: así se pinta en
      cuanto llega el documento, sin esperar los ~170 kB del bundle de Firebase ni el canje
      del token. Lo que antes se veía como varios segundos de página vacía ahora se ve como
      una página que ya está ahí, llenándose.

      Sin un solo color de la paleta: los colores de la clienta recién llegan con su
      documento de Firestore, y pintar el esqueleto en morado haría que la página cambiara
      de color a la vista. Gris neutro no parpadea.

      Lo borra el primer `pintar()`, que reemplaza el `innerHTML` de #app entero.
    -->
    <main id="app">
      <div class="esqueleto" role="status" aria-label="Cargando">
        <div class="esq-cabecera">
          <div class="esq-saludo"></div>
          <div class="esq-menu"></div>
        </div>
        <div class="tarjeta esq-hoy">
          <div class="esq-linea esq-corta"></div>
          <div class="esq-linea esq-titulo"></div>
          <div class="esq-linea"></div>
        </div>
        <div class="fila">
          <div class="tarjeta esq-stat">
            <div class="esq-linea esq-corta"></div>
            <div class="esq-linea esq-numero"></div>
          </div>
          <div class="tarjeta esq-stat">
            <div class="esq-linea esq-corta"></div>
            <div class="esq-linea esq-numero"></div>
          </div>
        </div>
        <div class="tarjeta esq-calendario">
          <div class="esq-cal-nav"></div>
          <div class="esq-cuadricula">
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="esq-leyenda"></div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
