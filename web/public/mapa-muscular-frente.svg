<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mapa muscular, vista de frente (hombre). Dibujo original de OSfit, hecho a partir de una
  referencia de estilo (ver docs/backlog-2.md, punto 4); no copia ningún archivo de terceros.

  Cada músculo es un <path> con clase "musculo", data-musculo (grupo) y un id único:
    musculo-<grupo>-der / musculo-<grupo>-izq   (derecha/izquierda DE LA PERSONA:
                                                 su derecha queda a la izquierda del dibujo)
  El abdomen es un solo bloque central: musculo-abdomen.
  Para pintar por nivel, basta con cambiar el fill desde CSS, por ejemplo:
    [data-musculo="pecho"] { fill: #ff8800; }
  Los colores de abajo son los de la referencia y solo sirven por defecto.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" role="img" aria-label="Mapa muscular de frente">
  <style>
    .fondo { fill: #000; }
    .silueta { fill: #c9cacf; stroke: #c9cacf; stroke-width: 2; stroke-linejoin: round; }
    .sin-color { fill: #c9cacf; stroke: #fff; stroke-width: 3; stroke-linejoin: round; }
    .musculo { stroke: #fff; stroke-width: 4; stroke-linejoin: round; }
    .detalle { fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; }
    [data-musculo="trapecio"]   { fill: #8fb6e8; }
    [data-musculo="hombro"]     { fill: #19c24a; }
    [data-musculo="pecho"]      { fill: #e0161b; }
    [data-musculo="biceps"]     { fill: #5aa2ee; }
    [data-musculo="antebrazo"]  { fill: #a88ef0; }
    [data-musculo="abdomen"]    { fill: #f2cf6b; }
    [data-musculo="cuadriceps"] { fill: #1f52d6; }
    [data-musculo="pantorrilla"]{ fill: #d5121a; }
  </style>
  <rect class="fondo" width="400" height="860"/>
